// ============================================================
// ЛОГИКА ТЕСТА
// ============================================================
let currentIndex = 0;
const userAnswers = new Array(questions.length).fill(null).map(() => []);

const el = {
  quiz: document.getElementById('quiz'),
  results: document.getElementById('results'),
  questionText: document.getElementById('questionText'),
  options: document.getElementById('options'),
  progressFill: document.getElementById('progressFill'),
  progressText: document.getElementById('progressText'),
  btnPrev: document.getElementById('btnPrev'),
  btnNext: document.getElementById('btnNext'),
  hint: document.getElementById('hint'),
  scoreCircle: document.getElementById('scoreCircle'),
  scoreNum: document.getElementById('scoreNum'),
  scoreLabel: document.getElementById('scoreLabel'),
  statCorrect: document.getElementById('statCorrect'),
  statWrong: document.getElementById('statWrong'),
  statSkipped: document.getElementById('statSkipped'),
  reviewList: document.getElementById('reviewList')
};

function renderQuestion() {
  const q = questions[currentIndex];
  el.questionText.textContent = q.q;
  el.options.innerHTML = '';

  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option' + (userAnswers[currentIndex].includes(i) ? ' selected' : '');
    div.innerHTML = `<input type="checkbox" id="opt_${i}" ${userAnswers[currentIndex].includes(i) ? 'checked' : ''}>
                     <label for="opt_${i}">${opt}</label>`;
    div.addEventListener('click', (e) => {
      if (e.target.tagName !== 'INPUT') {
        const cb = div.querySelector('input');
        cb.checked = !cb.checked;
      }
      toggleOption(i, div);
    });
    el.options.appendChild(div);
  });

  el.progressFill.style.width = ((currentIndex + 1) / questions.length * 100) + '%';
  el.progressText.textContent = `Вопрос ${currentIndex + 1} из ${questions.length}`;
  el.btnPrev.disabled = currentIndex === 0;

  if (currentIndex === questions.length - 1) {
    el.btnNext.textContent = 'Завершить тест';
    el.btnNext.classList.add('btn-finish');
  } else {
    el.btnNext.textContent = 'Далее →';
    el.btnNext.classList.remove('btn-finish');
  }

  const correctCount = q.correct.length;
  el.hint.textContent = correctCount > 1
    ? `Выберите ${correctCount} правильных ответов`
    : 'Выберите один правильный ответ';
}

function toggleOption(index, div) {
  const arr = userAnswers[currentIndex];
  const pos = arr.indexOf(index);
  if (pos === -1) {
    arr.push(index);
    div.classList.add('selected');
  } else {
    arr.splice(pos, 1);
    div.classList.remove('selected');
  }
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

function arraysEqual(a, b) {
  if (a.length !== b.length) return false;
  const sa = [...a].sort((x, y) => x - y);
  const sb = [...b].sort((x, y) => x - y);
  return sa.every((v, i) => v === sb[i]);
}

function finishQuiz() {
  let correct = 0, wrong = 0, skipped = 0;

  questions.forEach((q, i) => {
    const ua = userAnswers[i];
    if (ua.length === 0) skipped++;
    else if (arraysEqual(ua, q.correct)) correct++;
    else wrong++;
  });

  const total = questions.length;
  const percent = Math.round(correct / total * 100);
  let grade, color;
  if (percent >= 90) { grade = 'Отлично'; color = '#2ecc71'; }
  else if (percent >= 75) { grade = 'Хорошо'; color = '#3498db'; }
  else if (percent >= 60) { grade = 'Удовлетворительно'; color = '#f39c12'; }
  else { grade = 'Неудовлетворительно'; color = '#e74c3c'; }

  el.scoreCircle.style.background = color;
  el.scoreNum.textContent = percent + '%';
  el.scoreLabel.textContent = grade;
  el.statCorrect.textContent = correct;
  el.statWrong.textContent = wrong;
  el.statSkipped.textContent = skipped;

  // Разбор ошибок
  el.reviewList.innerHTML = '';
  const wrongItems = [];
  questions.forEach((q, i) => {
    const ua = userAnswers[i];
    const isCorrect = arraysEqual(ua, q.correct);
    const isSkipped = ua.length === 0;
    if (!isCorrect) wrongItems.push({ q, i, ua, isSkipped });
  });

  if (wrongItems.length === 0) {
    el.reviewList.innerHTML = '<p style="text-align:center;color:#2ecc71;font-weight:600;margin:20px 0;">Все ответы верны! Отличная работа!</p>';
  } else {
    const title = document.createElement('h3');
    title.textContent = 'Разбор ошибок';
    title.style.margin = '24px 0 16px';
    el.reviewList.appendChild(title);

    wrongItems.forEach(({ q, i, ua, isSkipped }) => {
      const div = document.createElement('div');
      div.className = 'review-item ' + (isSkipped ? 'skipped' : 'wrong');
      const userAnsText = ua.length === 0
        ? 'Нет ответа'
        : ua.map(idx => q.options[idx]).join('; ');
      const correctAnsText = q.correct.map(idx => q.options[idx]).join('; ');
      div.innerHTML = `
        <div class="review-q">${q.q}</div>
        <div class="review-answer wrong-ans"><span class="label">Ваш ответ:</span> ${userAnsText}</div>
        <div class="review-answer correct-ans"><span class="label">Правильный ответ:</span> ${correctAnsText}</div>
      `;
      el.reviewList.appendChild(div);
    });
  }

  el.quiz.style.display = 'none';
  el.results.style.display = 'block';
  window.scrollTo(0, 0);
}

function restartQuiz() {
  currentIndex = 0;
  userAnswers.forEach((_, i) => userAnswers[i] = []);
  el.results.style.display = 'none';
  el.quiz.style.display = 'block';
  renderQuestion();
  window.scrollTo(0, 0);
}

// Старт
renderQuestion();
