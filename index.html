<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест по судебной медицине</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f0f2f5;color:#1a1a2e;line-height:1.5;padding:16px}
.box{max-width:750px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.08);padding:24px}
h1{font-size:20px;text-align:center;margin-bottom:6px;color:#16213e}
.sub{text-align:center;color:#888;font-size:13px;margin-bottom:18px}
.pbar{height:8px;background:#e0e0e0;border-radius:4px;margin-bottom:6px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,#4361ee,#4cc9f0);border-radius:4px;transition:width .3s}
.ptext{text-align:right;font-size:12px;color:#888;margin-bottom:16px}
.qtext{font-size:16px;font-weight:600;margin-bottom:16px;color:#16213e}
.opt{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:2px solid #e0e0e0;border-radius:10px;cursor:pointer;transition:all .15s;margin-bottom:8px;user-select:none}
.opt:hover{border-color:#4361ee;background:#f8f9ff}
.opt.sel{border-color:#4361ee;background:#eef1ff}
.opt.right{border-color:#2ecc71;background:#e8f9ee}
.opt.wrong{border-color:#e74c3c;background:#fdeaea}
.opt input{margin-top:3px;width:18px;height:18px;accent-color:#4361ee;cursor:pointer;flex-shrink:0}
.opt label{cursor:pointer;flex:1;font-size:14px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
button{padding:12px 24px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.bcheck{background:#4361ee;color:#fff}
.bcheck:hover{background:#3a56d4}
.bnext{background:#2ecc71;color:#fff}
.bnext:hover{background:#27ae60}
.bprev{background:#e0e0e0;color:#333}
.bprev:hover{background:#d0d0d0}
button:disabled{opacity:.4;cursor:not-allowed}
.feedback{margin-top:14px;padding:14px;border-radius:10px;font-size:14px;display:none}
.feedback.ok{background:#e8f9ee;border-left:4px solid #2ecc71;color:#1e7e34;display:block}
.feedback.err{background:#fdeaea;border-left:4px solid #e74c3c;color:#a71d1d;display:block}
.feedback b{display:block;margin-bottom:6px;font-size:15px}
.hint{font-size:12px;color:#999;font-style:italic;margin-top:6px}
.res{display:none;text-align:center}
.res h2{font-size:22px;margin-bottom:14px}
.circle{width:130px;height:130px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 20px;color:#fff;font-weight:700}
.circle .num{font-size:34px;line-height:1}
.circle .lab{font-size:12px;opacity:.9;margin-top:4px}
.stats{display:flex;justify-content:center;gap:24px;margin-bottom:24px;flex-wrap:wrap}
.stat{text-align:center}
.stat .v{font-size:24px;font-weight:700}
.stat .l{font-size:12px;color:#888}
.stat.ok .v{color:#2ecc71}
.stat.no .v{color:#e74c3c}
.stat.sk .v{color:#f39c12}
.rev{text-align:left}
.revitem{border:1px solid #e0e0e0;border-radius:10px;padding:14px;margin-bottom:10px}
.revitem.ok{border-left:5px solid #2ecc71}
.revitem.no{border-left:5px solid #e74c3c}
.revitem.sk{border-left:5px solid #f39c12}
.revq{font-weight:600;font-size:14px;margin-bottom:8px}
.reva{font-size:13px;margin-bottom:3px}
.reva.ok{color:#1e7e34}
.reva.no{color:#a71d1d}
.restart{display:block;margin:20px auto 0;background:#16213e;color:#fff}
@media(max-width:600px){.box{padding:16px}.qtext{font-size:15px}.opt label{font-size:13px}}
</style>
</head>
<body>
<div class="box">
<div id="quiz">
<h1>Тест по судебной медицине</h1>
<p class="sub">Выберите все правильные ответы</p>
<div class="pbar"><div class="pfill" id="pf"></div></div>
<div class="ptext" id="pt"></div>
<div class="qtext" id="qt"></div>
<div id="opts"></div>
<div class="hint" id="hint"></div>
<div class="feedback" id="fb"></div>
<div class="nav">
<button class="bprev" id="bp" onclick="prev()">← Назад</button>
<button class="bcheck" id="bc" onclick="check()">Проверить</button>
<button class="bnext" id="bn" onclick="next()" style="display:none">Далее →</button>
</div>
</div>
<div class="res" id="res">
<h2>Результат</h2>
<div class="circle" id="circle"><span class="num" id="snum">0</span><span class="lab" id="slab"></span></div>
<div class="stats">
<div class="stat ok"><div class="v" id="sc">0</div><div class="l">Верно</div></div>
<div class="stat no"><div class="v" id="sw">0</div><div class="l">Неверно</div></div>
<div class="stat sk"><div class="v" id="ss">0</div><div class="l">Пропущено</div></div>
</div>
<div class="rev" id="rev"></div>
<button class="restart" onclick="restart()">Пройти заново</button>
</div>
</div>
<script>
var Q=[

{q:"1. В каких случаях предусмотрено обязательное проведение судебно-медицинской экспертизы?",o:["для установления причины смерти","для определения характера и степени вреда здоровью","для установления личности подозреваемого","для определения физического и психического состояния обвиняемого или подозреваемого","для установления возраста подозреваемого, обвиняемого и потерпевшего"],c:[0,1,3,4]},
{q:"2. Какие отделы предусмотрены в структуре Бюро судебно-медицинской экспертизы?",o:["отдел судебно-медицинской экспертизы трупов","судебно-медицинская лаборатория","отдел комплексных экспертиз","отдел судебно-медицинской экспертизы потерпевших, обвиняемых и других лиц","отдел сложных экспертиз","организационно-методический отдел"],c:[0,1,3,4,5]},
{q:"3. Что входит в обязанности судебно-медицинского эксперта?",o:["явка по вызову лица, производящего дознание или следствие, либо суда","присутствие в судебном заседании при рассмотрении дела, по которому он привлекался в качестве эксперта","дача заключения","сохранение в тайне данных предварительного следствия"],c:[0,2,3]},
{q:"4. В каких случаях судебно-медицинская экспертиза трупа проводится несколькими экспертами?",o:["в случае экспертизы трупа иностранного гражданина","повторной экспертизы трупа","экспертизы эксгумированного трупа","для установления рода насильственной смерти"],c:[0,1,2]},
{q:"5. Из каких частей состоит «Заключение эксперта»?",o:["исследовательской части","протокола осмотра места происшествия","введения","выводов"],c:[0,2,3]},
{q:"6. Врач-специалист в области судебной медицины при осмотре места происшествия должен:",o:["установить факт наступления смерти","помочь следователю осмотреть труп и описать результаты осмотра в протоколе","помочь следователю в обнаружении, фиксации и изъятии вещественных доказательств","составить протокол осмотра места происшествия","направить вещественные доказательства на лабораторные исследования"],c:[3]},
{q:"7. Какие сведения должны быть внесены в протокол осмотра места происшествия и трупа?",o:["сведения о температуре тела","сведения о состоянии трупных пятен","сведения о состоянии трупного окоченения","сведения о давности наступления смерти"],c:[0,1,2,3]},
{q:"8. В какой последовательности производится наружный осмотр трупа (пронумеровать)?",o:["описание повреждений тела","описание одежды","описание трупных явлений"],c:[0,1,2]},
{q:"9. Какие суправитальные реакции могут наблюдаться при исследовании трупа?",o:["механическая возбудимость мышц","электрическая возбудимость мышц","реакция зрачков на химическое воздействие","трупное высыхание"],c:[0,1,2]},
{q:"10. К ориентирующим признакам смерти относятся:",o:["бледность кожных покровов","отсутствие тактильной, обонятельной чувствительности","отсутствие сознания, дыхания, пульса, сердцебиения","фибриллярные сокращения скелетных мышц","отсутствие роговичного рефлекса, реакции зрачков на свет"],c:[0,1,2,4]},
{q:"11. Достоверными признаками смерти являются:",o:["отсутствие пульса","признак Белоглазова (феномен «кошачьего глаза»)","трупные пятна и трупное окоченение","снижение температуры тела ниже 20 град. С","поздние трупные явления"],c:[1,2,3,4]},
{q:"12. Перечислите ранние трупные изменения.",o:["трупное окоченение","охлаждение тела","аутолиз","гниение","трупные пятна"],c:[0,1,2,4]},
{q:"13. Перечислите поздние трупные изменения:",o:["трупные пятна","гниение","жировоск","мумификация","аутолиз"],c:[1,2,3]},
{q:"14. Какие из перечисленных признаков характерны для ушибленной раны?",o:["осадненные края","наличие раневого канала","кровоподтечные края","соединительнотканные перемычки между краями"],c:[0,2,3]},
{q:"15. Вдавленный перелом костей черепа образуется от действия тупого предмета:",o:["с широкой поверхностью","с ограниченной поверхностью","с угловатой поверхностью","с цилиндрической поверхностью"],c:[1,2]},
{q:"16. Дырчатый перелом черепа образуется от действия тупого предмета:",o:["с широкой травмирующей поверхностью","с треугольной ограниченной травмирующей поверхностью","с прямоугольной ограниченной поверхностью","с квадратной ограниченной травмирующей поверхностью"],c:[1,2,3]},
{q:"17. Назовите основные признаки резаной раны:",o:["прямолинейная форма","криволинейная форма","зияние раны","осаднение краев раны","остроугольные концы"],c:[0,1,2,4]},
{q:"18. Основными элементами колото-резаной раны являются:",o:["входное отверстие","лезвийная часть основного разреза","обушковая часть основного разреза","выходное отверстие","дополнительный разрез"],c:[1,2,4]},
{q:"19. Назовите признаки основного разреза колото-резаной раны:",o:["ровные края","осаднение краев","зияние раны","линейная форма","следы обильного наружного кровотечения"],c:[0,1,3]},
{q:"20. Назовите разновидности транспортного травматизма:",o:["наземный","воздушный","космический","водный"],c:[0,1,3]},
{q:"21. Перечислите фазы механизма травмы при полном переезде тела колесом автомобиля:",o:["соударение вращающегося колеса с телом","продвижение и перемещение тела колесом по дороге","накатывание и перекатывание колеса через тело","соударение частей автомобиля с телом","вторичное продвижение тела колесом и другими частями автомобиля по дороге"],c:[0,1,2,4]},
{q:"22. При переезде области живота колесом автомобиля возникают следующие повреждения:",o:["надрывы и разрывы кожи в паховых областях","надрывы и разрывы брыжейки и тонкого кишечника","разрывы промежности","разможжение и отрывы внутренних органов","разрывы диафрагмы"],c:[0,1,3,4]},
{q:"23. Перечислите фазы механизма травмы при столкновении легкового автомобиля с человеком:",o:["соударение частей автомобиля с человеком","накатывание колеса автомобиля на тело","падение тела на автомобиль","отбрасывание тела и падение его на дорогу","продвижение тела по дороге"],c:[0,2,3,4]},
{q:"24. Назовите фазы травмы при выпадении человека из кузова грузового автомобиля:",o:["соударение частей автомобиля с человеком","соударение тела с частями кузова автомобиля","падение тела из кузова на дорогу","продвижение тела по дороге"],c:[1,2,3]},
{q:"25. При столкновении с автомобилем пешеход получает повреждения от воздействия:",o:["бампера автомобиля","колеса автомобиля","дорожного покрытия","капота автомобиля"],c:[0,1,2,3]},
{q:"26. В салоне автомобиля травма может быть получена от:",o:["удара о части автомобиля","удара о находящиеся в салоне предметы","сдавления тела между сместившимися частями салона","воздействия ремней безопасности"],c:[0,1,2,3]},
{q:"27. Перечислите виды механизмов мотоциклетной травмы:",o:["столкновение движущегося мотоцикла с человеком","переезд тела колесом мотоцикла","падение человека с движущегося мотоцикла","столкновение мотоцикла с транспортным средством","сдавление тела между частями мотоцикла и дорогой"],c:[0,1,2,4]},
{q:"28. Назовите фазы травмирования при столкновении движущегося мотоцикла с человеком:",o:["соударение частей мотоцикла (колеса и др.) с человеком","падение человека на мотоцикл и его водителя","падение человека на дорогу","продвижение тела по дорожному покрытию"],c:[0,1,2,3]},
{q:"29. К рельсовой травме относятся:",o:["железнодорожная","трамвайная","травма от механизмов и устройств на рельсах (подъемные краны)","травма от подвижного состава метрополитена","травма от подвижного состава узкоколейного железнодорожного транспорта"],c:[0,1,3,4]},
{q:"30. Назовите виды механизмов железнодорожной травмы:",o:["от столкновения движущегося поезда с человеком","от переезда колеса (колесами) поезда","от сдавления тела между частями поезда и другими предметами","от выпадения человека из движущегося поезда","от воздействия на человека внутренних частей вагона поезда"],c:[0,1,2,3,4]},
{q:"31. Перечислите фазы механизма травмы при столкновении движущегося поезда с человеком:",o:["удар частями поезда","падение тела на поезд","отбрасывание тела на полотно дороги","накатывание колеса на тело","продвижение тела по полотну дороги"],c:[0,2,4]},
{q:"32. Для сдавления тела между тарелками буферов наиболее характерными повреждениями являются:",o:["отпечатки на коже контуров тарелки буферов (кровоподтеки)","разрывы внутренних органов","отслоение кожи и подкожной жировой клетчатки","отрывы, перемещения и выпадения внутренних органов","множественные переломы ребер, грудины"],c:[0,1,3,4]},
{q:"33. Какие повреждения наблюдаются у экипажа и пассажиров при падении воздушного судна на землю:",o:["разрушение тела (полное, грубое)","множественные переломы костей","множественные разрывы и отрывы внутренних органов","субарахноидальное кровоизлияние","множественные ссадины, кровоподтеки, раны на теле"],c:[0,1,2,4]},
{q:"34. Какими частями самолета на земле могут причиняться повреждения человеку:",o:["работающей турбиной","лопастями рабочего винта","колесами","передней кромкой крыла","хвостовым оперением"],c:[0,1,2,3,4]},
{q:"35. Какие существуют виды огнестрельного оружия?",o:["боевое","спортивное","нарезное","охотничье","специальное","атипичное","самодельное"],c:[0,1,3,4,5,6]},
{q:"36. К повреждающим факторам выстрела относят:",o:["огнестрельный снаряд","само оружие","гильзу","факторы близкого выстрела","вторичные снаряды"],c:[0,3,4]},
{q:"37. Какими составными частями заряда отличается охотничий патрон от боевого?",o:["снарядом","гильзой","капсулем","пыжом","порохом"],c:[0,1,3]},
{q:"38. Какое повреждающее действие на кожу оказывает пуля в зависимости от ее кинетической энергии?",o:["пробивное","клиновидное","гидродинамическое","контузионное"],c:[0,1,3]},
{q:"39. Какие существуют пули специального назначения?",o:["зажигательные","трассирующие","осветительные","бронебойные"],c:[0,1,3]},
{q:"40. При какой дистанции выстрела обнаруживаются дополнительные факторы (сопутствующие компоненты выстрела)?",o:["в упор","на близкой дистанции","упор под углом","на неблизкой дистанции"],c:[0,1,2]},
{q:"41. Дистанция близкого расстояния выстрела делится на зоны:",o:["механического действия пороховых газов","отложение копоти, пороховых зерен и мелких металлических частиц","отложение ружейной смазки","отложение пороховых зерен и мелких частиц"],c:[0,1,3]},
{q:"42. Какие основные признаки характеризуют входную огнестрельную пулевую рану?",o:["дефект ткани (минус-ткань)","вывернутые наружу края","поясок осаднения","поясок загрязнения","круглая форма"],c:[0,2,3,4]},
{q:"43. Элементами раневого канала являются:",o:["входное отверстие","зона разрушения (собственно раневой канал)","стенки раневого канала","зона бокового ушиба тканей","зона молекулярного сотрясения тканей"],c:[1,2,3,4]},
{q:"44. Огнестрельные повреждения подразделяются на:",o:["сквозные","слепые","опоясывающие","касательные","прерванные"],c:[0,1,3]},
{q:"45. При каких условиях образуется феномен Виноградова?",o:["высокая скорость полета пули","наличие толстой одежды","наличие двухслойной одежды","наличие промежутка слоями одежды"],c:[0,2,3]},
{q:"46. Характеризующимися признаками ранений, причиненных автоматической очередью выстрелов, являются:",o:["множественность ранений","одностороннее расположение входных ран","параллельные направления раневых каналов","одинаковая дистанция выстрелов"],c:[0,1,2,3]},

// ============ ЛОГИКА ТЕСТА ============
var idx=0;
var ua=Q.map(function(){return[]});
var checked=Q.map(function(){return false});

var $=function(id){return document.getElementById(id)};

function render(){
  var q=Q[idx];
  $("qt").textContent=q.q;
  var html="";
  q.o.forEach(function(opt,i){
    var cls="opt";
    if(checked[idx]){
      if(q.c.indexOf(i)>-1) cls+=" right";
      else if(ua[idx].indexOf(i)>-1) cls+=" wrong";
    } else if(ua[idx].indexOf(i)>-1) cls+=" sel";
    var dis=checked[idx]?"disabled":"";
    html+='<div class="'+cls+'" onclick="pick('+i+',this)"><input type="checkbox" '+dis+' '+(ua[idx].indexOf(i)>-1?"checked":"")+'><label>'+opt+'</label></div>';
  });
  $("opts").innerHTML=html;
  $("pf").style.width=((idx+1)/Q.length*100)+"%";
  $("pt").textContent="Вопрос "+(idx+1)+" из "+Q.length;
  $("bp").disabled=idx===0;
  $("hint").textContent=q.c.length>1?"Выберите "+q.c.length+" правильных ответов":"Выберите один правильный ответ";
  if(checked[idx]){
    $("bc").style.display="none";
    $("bn").style.display="inline-block";
    var allOk=arrEq(ua[idx],q.c);
    if(allOk) $("fb").className="feedback ok", $("fb").innerHTML="<b>✅ Верно!</b>";
    else{
      var correct=q.c.map(function(x){return q.o[x]}).join("; ");
      $("fb").className="feedback err";
      $("fb").innerHTML="<b>❌ Ошибка</b>Правильный ответ: "+correct;
    }
  } else {
    $("bc").style.display="inline-block";
    $("bn").style.display="none";
    $("fb").className="feedback";
  }
  if(idx===Q.length-1 && checked[idx]) $("bn").textContent="Завершить";
  else $("bn").textContent="Далее →";
}

function pick(i,el){
  if(checked[idx]) return;
  var pos=ua[idx].indexOf(i);
  if(pos===-1) ua[idx].push(i);
  else ua[idx].splice(pos,1);
  render();
}

function check(){
  if(ua[idx].length===0){alert("Выберите хотя бы один ответ");return;}
  checked[idx]=true;
  render();
}

function next(){
  if(idx<Q.length-1){idx++;render();window.scrollTo(0,0);}
  else finish();
}

function prev(){
  if(idx>0){idx--;render();window.scrollTo(0,0);}
}

function arrEq(a,b){
  if(a.length!==b.length) return false;
  var sa=a.slice().sort(function(x,y){return x-y});
  var sb=b.slice().sort(function(x,y){return x-y});
  for(var i=0;i<sa.length;i++) if(sa[i]!==sb[i]) return false;
  return true;
}

function finish(){
  var ok=0,no=0,sk=0;
  Q.forEach(function(q,i){
    if(ua[i].length===0) sk++;
    else if(arrEq(ua[i],q.c)) ok++;
    else no++;
  });
  var pct=Math.round(ok/Q.length*100);
  var color,grade;
  if(pct>=90){color="#2ecc71";grade="Отлично"}
  else if(pct>=75){color="#3498db";grade="Хорошо"}
  else if(pct>=60){color="#f39c12";grade="Удовлетворительно"}
  else{color="#e74c3c";grade="Неудовлетворительно"}
  $("circle").style.background=color;
  $("snum").textContent=pct+"%";
  $("slab").textContent=grade;
  $("sc").textContent=ok;
  $("sw").textContent=no;
  $("ss").textContent=sk;
  var revHtml="";
  Q.forEach(function(q,i){
    if(arrEq(ua[i],q.c)) return;
    var cls=ua[i].length===0?"sk":"no";
    var userTxt=ua[i].length===0?"Нет ответа":ua[i].map(function(x){return q.o[x]}).join("; ");
    var corrTxt=q.c.map(function(x){return q.o[x]}).join("; ");
    revHtml+='<div class="revitem '+cls+'"><div class="revq">'+q.q+'</div><div class="reva no"><b>Ваш ответ:</b> '+userTxt+'</div><div class="reva ok"><b>Правильно:</b> '+corrTxt+'</div></div>';
  });
  if(revHtml==="") revHtml='<p style="text-align:center;color:#2ecc71;font-weight:600">Все ответы верны! Отлично! 🎉</p>';
  $("rev").innerHTML=revHtml;
  $("quiz").style.display="none";
  $("res").style.display="block";
  window.scrollTo(0,0);
}

function restart(){
  idx=0;
  ua=Q.map(function(){return[]});
  checked=Q.map(function(){return false});
  $("res").style.display="none";
  $("quiz").style.display="block";
  render();
  window.scrollTo(0,0);
}

render();
</script>
